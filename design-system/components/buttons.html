<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedesiaNet — Botones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap');
  :root {
    --bg:#000;--accent:#00D4FF;--accent-hover:#33DDFF;--accent-muted:#00A3CC;
    --text:#F0F0F5;--text2:#A0A0B0;--text3:#606070;
    --glass:rgba(255,255,255,0.04);--glass-hover:rgba(255,255,255,0.08);
    --border:rgba(255,255,255,0.08);--border-hover:rgba(0,212,255,0.3);
    --error:#FF4D6A;--success:#00E68A;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);padding:40px}
  h1{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#00D4FF,#0066CC);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{font-size:14px;color:var(--text2);margin-bottom:48px}
  .section{margin-bottom:48px}
  .section-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:2px;color:var(--text3);margin-bottom:24px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  .row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:24px}
  .row-label{font-size:12px;color:var(--text3);margin-bottom:8px;font-weight:500}

  /* === BOTONES === */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    font-family:'Space Grotesk',sans-serif;font-weight:600;
    border:none;cursor:pointer;
    transition:all 0.3s cubic-bezier(0.4,0,0.2,1);
    position:relative;overflow:hidden;
  }
  .btn::before{
    content:'';position:absolute;top:50%;left:50%;
    width:0;height:0;border-radius:50%;
    background:rgba(255,255,255,0.1);
    transition:width 0.5s,height 0.5s,top 0.5s,left 0.5s;
  }
  .btn:hover::before{width:300px;height:300px;top:-100px;left:-50px}

  /* Primary */
  .btn-primary{
    background:var(--accent);color:#000;
    box-shadow:0 0 20px rgba(0,212,255,0.3),0 4px 12px rgba(0,0,0,0.3);
  }
  .btn-primary:hover{
    background:var(--accent-hover);
    box-shadow:0 0 30px rgba(0,212,255,0.5),0 8px 24px rgba(0,0,0,0.4);
    transform:translateY(-2px);
  }
  .btn-primary:active{transform:translateY(0);box-shadow:0 0 15px rgba(0,212,255,0.3)}

  /* Secondary / Glass */
  .btn-secondary{
    background:var(--glass);color:var(--text);
    border:1px solid var(--border);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  }
  .btn-secondary:hover{
    background:var(--glass-hover);border-color:var(--border-hover);
    box-shadow:0 0 20px rgba(0,212,255,0.15);
    transform:translateY(-2px);
  }

  /* Ghost */
  .btn-ghost{background:transparent;color:var(--accent);border:none}
  .btn-ghost:hover{background:rgba(0,212,255,0.08);transform:translateY(-1px)}

  /* Outline */
  .btn-outline{
    background:transparent;color:var(--accent);
    border:1.5px solid var(--accent);
  }
  .btn-outline:hover{
    background:rgba(0,212,255,0.08);
    box-shadow:0 0 20px rgba(0,212,255,0.2);
    transform:translateY(-2px);
  }

  /* Danger */
  .btn-danger{
    background:var(--error);color:#fff;
    box-shadow:0 0 20px rgba(255,77,106,0.3);
  }
  .btn-danger:hover{box-shadow:0 0 30px rgba(255,77,106,0.5);transform:translateY(-2px)}

  /* Sizes */
  .btn-sm{padding:8px 16px;font-size:13px;border-radius:8px}
  .btn-md{padding:12px 24px;font-size:15px;border-radius:10px}
  .btn-lg{padding:16px 32px;font-size:17px;border-radius:12px}
  .btn-xl{padding:20px 40px;font-size:18px;border-radius:14px}

  /* Icon button */
  .btn-icon{padding:12px;border-radius:12px;width:48px;height:48px}
  .btn-icon.btn-sm{width:36px;height:36px;padding:8px;border-radius:10px}
  .btn-icon.btn-lg{width:56px;height:56px;padding:14px;border-radius:14px}

  /* Disabled */
  .btn:disabled,.btn-disabled{
    opacity:0.35;cursor:not-allowed;pointer-events:none;
    box-shadow:none;transform:none;
  }

  /* Loading */
  .btn-loading{pointer-events:none;position:relative}
  .btn-loading .btn-text{opacity:0}
  .btn-loading::after{
    content:'';position:absolute;width:18px;height:18px;
    border:2px solid transparent;border-top:2px solid currentColor;
    border-radius:50%;animation:spin 0.7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Full width */
  .btn-full{width:100%}

  .arrow{transition:transform 0.3s ease}
  .btn:hover .arrow{transform:translateX(4px)}
</style>
</head>
<body>
  <h1>Botones</h1>
  <p class="subtitle">RedesiaNet Design System — Variantes, tamaños y estados</p>

  <div class="section">
    <div class="section-title">Variantes</div>
    <div class="row">
      <button class="btn btn-primary btn-md">Primary CTA</button>
      <button class="btn btn-secondary btn-md">Secondary Glass</button>
      <button class="btn btn-outline btn-md">Outline</button>
      <button class="btn btn-ghost btn-md">Ghost</button>
      <button class="btn btn-danger btn-md">Danger</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Tamaños</div>
    <div class="row">
      <button class="btn btn-primary btn-sm">Small</button>
      <button class="btn btn-primary btn-md">Medium</button>
      <button class="btn btn-primary btn-lg">Large</button>
      <button class="btn btn-primary btn-xl">Extra Large</button>
    </div>
    <div class="row">
      <button class="btn btn-secondary btn-sm">Small</button>
      <button class="btn btn-secondary btn-md">Medium</button>
      <button class="btn btn-secondary btn-lg">Large</button>
      <button class="btn btn-secondary btn-xl">Extra Large</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Con icono & flecha</div>
    <div class="row">
      <button class="btn btn-primary btn-lg"><span class="btn-text">Solicitar demo</span> <span class="arrow">&rarr;</span></button>
      <button class="btn btn-secondary btn-lg"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> <span class="btn-text">Explorar servicios</span></button>
      <button class="btn btn-outline btn-md"><span class="btn-text">Ver caso de éxito</span> <span class="arrow">&rarr;</span></button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Estados</div>
    <div class="row-label">Disabled</div>
    <div class="row">
      <button class="btn btn-primary btn-md" disabled>Primary Disabled</button>
      <button class="btn btn-secondary btn-md" disabled>Secondary Disabled</button>
      <button class="btn btn-outline btn-md" disabled>Outline Disabled</button>
    </div>
    <div class="row-label">Loading</div>
    <div class="row">
      <button class="btn btn-primary btn-md btn-loading"><span class="btn-text">Enviando...</span></button>
      <button class="btn btn-secondary btn-md btn-loading"><span class="btn-text">Cargando...</span></button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Full Width</div>
    <div style="max-width:400px">
      <button class="btn btn-primary btn-lg btn-full" style="margin-bottom:12px">Empezar ahora <span class="arrow">&rarr;</span></button>
      <button class="btn btn-secondary btn-lg btn-full">Contactar equipo</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Icon Buttons</div>
    <div class="row">
      <button class="btn btn-secondary btn-icon btn-sm"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <button class="btn btn-secondary btn-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
      <button class="btn btn-primary btn-icon btn-lg"><svg width="24" height="24" fill="none" stroke="#000" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
    </div>
  </div>
</body>
</html>
